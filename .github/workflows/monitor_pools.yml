name: Multi-DEX Pool Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:          # allow manual run from GitHub UI

permissions:
  contents: write             # needed to commit state_monitor.json

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4        # kill if it hangs (keeps within 5-min window)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          GRAPH_API_KEY:   ${{ secrets.GRAPH_API_KEY }}   # optional: enables The Graph decentralised network
        run: python scripts/monitor_pools.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_monitor.json
          if git diff --staged --quiet; then
            echo "state_monitor.json unchanged, skipping commit"
          else
            git commit -m "chore: update monitor state [skip ci]"
            git pull --rebase origin main
            git push
          fi
